<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inkpact – Admin</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Login -->
<div id="login" class="center hidden">
  <form class="card" style="width:100%;max-width:380px" id="loginForm">
    <div class="brand" style="color:var(--ink);margin-bottom:6px">Ink<span style="color:var(--accent)">pact</span></div>
    <p class="muted small" style="margin-top:0">Send any document for digital signature.</p>
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" style="width:100%;margin-top:14px">Log in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- App -->
<div id="app" class="hidden">
  <div class="top">
    <div class="brand">Ink<span>pact</span></div>
    <div style="display:flex;gap:8px">
      <button class="btn sm" id="newBtn" style="background:#fff;color:var(--ink)">+ New document</button>
      <button class="btn sm lite" id="logout">Log out</button>
    </div>
  </div>

  <div class="wrap">
    <!-- New offer -->
    <div id="newPanel" class="card hidden" style="margin-bottom:20px">
      <h2>Send a document for signature</h2>
      <form id="offerForm">
        <div class="grid">
          <div><label>Company *</label><input name="company" list="companies" required placeholder="Company name"></div>
          <div><label>Document title *</label><input name="role" list="titles" required placeholder="e.g. Offer Letter – Pre-primary Teacher"></div>
          <div><label>Signer name *</label><input name="candidateName" required></div>
          <div><label>Signer email *</label><input name="candidateEmail" type="email" required></div>
          <div class="full"><label>Note to signer (optional)</label><textarea name="message" placeholder="Shown in the email above the Sign button"></textarea></div>
          <div class="full"><label>Document (PDF) *</label><input name="pdf" id="pdfInput" type="file" accept="application/pdf" required></div>
        </div>
        <datalist id="companies">
          <option>Lavana Lifestyle Solutions</option>
          <option>Toddler's Block</option>
          <option>Woodford International School</option>
          <option>Finn Education Trust</option>
          <option>Woodford Knowledge Pvt. Ltd.</option>
          <option>S&amp;T Infra</option>
          <option>Novaderm Aesthetics</option>
        </datalist>
        <datalist id="titles">
          <option>Offer Letter</option><option>Appointment Letter</option><option>Employment Agreement</option>
          <option>Non-Disclosure Agreement (NDA)</option><option>Rent / Lease Agreement</option><option>Vendor Agreement</option>
          <option>Purchase Order</option><option>Partnership Deed</option><option>Admission Form</option><option>Consent Form</option>
        </datalist>

        <div id="placeWrap" class="hidden" style="margin-top:18px">
          <label>Tap on the document where the signer should sign <span class="muted" id="placeInfo">(default: bottom-right of last page)</span></label>
          <div class="pages" id="adminPages"></div>
        </div>

        <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
          <button class="btn" id="sendBtn">Send for signature</button>
          <button type="button" class="btn ghost" id="cancelNew">Cancel</button>
        </div>
        <div class="err" id="formErr"></div>
      </form>
    </div>

    <h1>Documents</h1>
    <div class="stats">
      <div class="stat"><span>Sent</span><b id="sTotal">0</b></div>
      <div class="stat"><span>Awaiting</span><b id="sWait">0</b></div>
      <div class="stat"><span>Signed</span><b id="sSigned" style="color:var(--ok)">0</b></div>
      <div class="stat"><span>Declined</span><b id="sDecl" style="color:var(--bad)">0</b></div>
    </div>
    <div class="card">
      <input id="search" placeholder="Search name, document, company…" style="margin-bottom:8px">
      <div id="list"><p class="muted">Loading…</p></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { renderPdf, placeMarker, BOX_W } from "/pdfview.js";

const $ = (s) => document.querySelector(s);
let KEY = localStorage.getItem("os_key") || "";
let offers = [];
let sig = null; // {page, x, y}

const toast = (t) => { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2600); };
const api = async (path, opts = {}) => {
  const r = await fetch("/api" + path, { ...opts, headers: { "x-admin-key": KEY, ...(opts.headers || {}) } });
  if (r.status === 401) { showLogin(); throw new Error("Please log in"); }
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || "Request failed"); }
  return r;
};
const fmt = (iso) => iso ? new Date(iso).toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function showLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
function showApp() { $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); load(); }

$("#loginForm").onsubmit = async (e) => {
  e.preventDefault(); $("#loginErr").textContent = "";
  KEY = $("#pw").value;
  const r = await fetch("/api/login", { method: "POST", headers: { "x-admin-key": KEY } });
  if (r.ok) { localStorage.setItem("os_key", KEY); showApp(); } else $("#loginErr").textContent = "Wrong password";
};
$("#logout").onclick = () => { localStorage.removeItem("os_key"); KEY = ""; showLogin(); };

async function load() {
  try { offers = await (await api("/offers")).json(); render(); } catch (e) { toast(e.message); }
}

function render() {
  const q = $("#search").value.toLowerCase();
  const list = offers.filter((o) => !q || [o.candidateName, o.role, o.company, o.candidateEmail].join(" ").toLowerCase().includes(q));
  $("#sTotal").textContent = offers.length;
  $("#sWait").textContent = offers.filter((o) => ["sent", "viewed"].includes(o.status)).length;
  $("#sSigned").textContent = offers.filter((o) => o.status === "signed").length;
  $("#sDecl").textContent = offers.filter((o) => o.status === "declined").length;
  if (!list.length) { $("#list").innerHTML = `<p class="muted">${offers.length ? "No matches." : "No documents yet. Tap “+ New document” to send your first one."}</p>`; return; }
  $("#list").innerHTML = list.map((o) => {
    const when = o.status === "signed" ? `Signed ${fmt(o.signedAt)}` : o.status === "declined" ? `Declined ${fmt(o.declinedAt)}${o.declineReason ? " – “" + esc(o.declineReason) + "”" : ""}` : o.status === "viewed" ? `Viewed ${fmt(o.viewedAt)}` : `Sent ${fmt(o.createdAt)}`;
    const open = ["sent", "viewed"].includes(o.status);
    return `<div class="offer">
      <div class="who"><b>${esc(o.candidateName)}</b> <span class="pill ${o.status}">${o.status}</span><br>
        <span class="small">${esc(o.role)} · ${esc(o.company)}</span><br>
        <span class="small muted">${esc(o.candidateEmail)} · ${when}</span></div>
      <div class="acts">
        <button class="btn sm ${o.status === "signed" ? "" : "ghost"}" data-a="pdf" data-id="${o.id}">${o.status === "signed" ? "Signed PDF" : "View PDF"}</button>
        ${open ? `<button class="btn sm ghost" data-a="copy" data-id="${o.id}">Copy link</button>
        <button class="btn sm ghost" data-a="resend" data-id="${o.id}">Remind</button>
        <button class="btn sm danger" data-a="cancel" data-id="${o.id}">Withdraw</button>` : ""}
        ${o.status !== "signed" ? `<button class="btn sm danger" data-a="del" data-id="${o.id}" title="Delete">✕</button>` : ""}
      </div></div>`;
  }).join("");
}
$("#search").oninput = render;

$("#list").onclick = async (e) => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const id = b.dataset.id, o = offers.find((x) => x.id === id), a = b.dataset.a;
  try {
    if (a === "pdf") {
      const blob = await (await api(`/offers/${id}/pdf`)).blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url; link.download = `${o.status === "signed" ? "Signed - " : ""}${o.role} - ${o.candidateName}.pdf`;
      link.click(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
    if (a === "copy") { await navigator.clipboard.writeText(`${location.origin}/sign.html?id=${id}`); toast("Signing link copied – you can WhatsApp it too"); }
    if (a === "resend") { b.disabled = true; await api(`/offers/${id}/resend`, { method: "POST" }); toast("Reminder email sent"); load(); }
    if (a === "cancel" && confirm(`Withdraw “${o.role}” sent to ${o.candidateName}? The link will stop working.`)) { await api(`/offers/${id}/cancel`, { method: "POST" }); toast("Withdrawn"); load(); }
    if (a === "del" && confirm(`Delete “${o.role}” for ${o.candidateName} permanently?`)) { await api(`/offers/${id}`, { method: "DELETE" }); toast("Deleted"); load(); }
  } catch (err) { toast(err.message); b.disabled = false; }
};

// ---- New offer ----
$("#newBtn").onclick = () => { $("#newPanel").classList.remove("hidden"); $("#newPanel").scrollIntoView({ behavior: "smooth" }); };
$("#cancelNew").onclick = () => { $("#offerForm").reset(); $("#placeWrap").classList.add("hidden"); sig = null; $("#newPanel").classList.add("hidden"); };

$("#pdfInput").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  $("#placeWrap").classList.remove("hidden");
  const pagesEl = $("#adminPages");
  pagesEl.innerHTML = '<p class="muted">Loading preview…</p>';
  try {
    const pages = await renderPdf(new Uint8Array(await f.arrayBuffer()), pagesEl);
    const last = pages.length - 1;
    sig = { page: last, x: 0.6, y: 0.8 };
    placeMarker(pages[last], sig.x, sig.y, "Signer signs here");
    pages.forEach((wrap, i) => {
      wrap.classList.add("pick");
      wrap.onclick = (ev) => {
        const r = wrap.getBoundingClientRect();
        let x = (ev.clientX - r.left) / r.width - BOX_W / 2;
        let y = (ev.clientY - r.top) / r.height - 0.03;
        x = Math.min(Math.max(x, 0.02), 0.98 - BOX_W); y = Math.min(Math.max(y, 0.02), 0.9);
        pages.forEach((p) => p.querySelector(".marker")?.remove());
        sig = { page: i, x, y };
        placeMarker(wrap, x, y, "Signer signs here");
        $("#placeInfo").textContent = `(page ${i + 1} selected – tap elsewhere to move)`;
      };
    });
    pages[last].scrollIntoView({ block: "nearest" });
  } catch { pagesEl.innerHTML = '<p class="err">Could not read this PDF.</p>'; }
};

$("#offerForm").onsubmit = async (e) => {
  e.preventDefault(); $("#formErr").textContent = "";
  const fd = new FormData(e.target);
  if (sig) { fd.set("sigPage", sig.page); fd.set("sigX", sig.x.toFixed(4)); fd.set("sigY", sig.y.toFixed(4)); }
  const btn = $("#sendBtn"); btn.disabled = true; btn.textContent = "Sending…";
  try {
    await api("/offers", { method: "POST", body: fd });
    toast(`Sent to ${fd.get("candidateEmail")} for signature`);
    $("#cancelNew").click(); load();
  } catch (err) { $("#formErr").textContent = err.message; }
  btn.disabled = false; btn.textContent = "Send for signature";
};

KEY ? showApp() : showLogin();
</script>
</body>
</html>
